version: 2

# One weekly PR for all version updates, including major upgrades.
multi-ecosystem-groups:
  dependency-digest:
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/London
    open-pull-requests-limit: 1
    commit-message:
      prefix: chore(deps)

updates:
  - package-ecosystem: npm
    directory: /
    multi-ecosystem-group: dependency-digest
    patterns: ["*"]
    # Match the local three-day package cooldown. Security updates are exempt.
    cooldown:
      default-days: 3
    # Security updates run independently of the weekly version digest.
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: cargo
    directories:
      - /src-tauri
      - /crates/wsl-core
    multi-ecosystem-group: dependency-digest
    patterns: ["*"]
    groups:
      rust-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    multi-ecosystem-group: dependency-digest
    patterns: ["*"]
    groups:
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
