version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/London
    open-pull-requests-limit: 10
    # Match the local three-day package cooldown. Security updates are exempt.
    cooldown:
      default-days: 3
    groups:
      npm-compatible:
        patterns: ["*"]
        update-types: [minor, patch]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: cargo
    directories:
      - /src-tauri
      - /crates/wsl-core
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/London
    open-pull-requests-limit: 10
    groups:
      rust-compatible:
        patterns: ["*"]
        update-types: [minor, patch]
      rust-security:
        applies-to: security-updates
        patterns: ["*"]
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/London
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: chore(ci)
