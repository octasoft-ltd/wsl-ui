name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      run_e2e:
        description: 'Run E2E tests'
        required: false
        default: false
        type: boolean

env:
  CARGO_TERM_COLOR: always
  NODE_OPTIONS: --trace-deprecation

jobs:
  # Unit tests - runs on all triggers
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Run unit tests
        shell: bash
        run: npm run test:run 2>&1 | tee node-tests.log

      - name: Type-check desktop E2E tests
        run: npm run test:e2e:typecheck

      - name: Build frontend
        shell: bash
        run: npm run build 2>&1 | tee node-build.log

      - name: Upload Node compatibility logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: node-compatibility-${{ matrix.node }}
          path: |
            node-tests.log
            node-build.log
          if-no-files-found: ignore
          retention-days: 14

  # Rust tests - runs on all triggers (Windows required for winreg)
  rust-tests:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: aarch64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            src-tauri
            crates/wsl-core
          cache-on-failure: true

      - name: Run Rust tests
        working-directory: src-tauri
        # Release Please bumps crate versions without updating Cargo.lock.
        run: cargo test

      - name: Run wsl-core tests
        working-directory: crates/wsl-core
        run: cargo test

      - name: Build Windows ARM64 app
        working-directory: src-tauri
        # Exercise the ARM64 native TLS/compiler toolchain before release publishing.
        run: cargo build --locked --target aarch64-pc-windows-msvc

  # E2E tests - only runs on manual trigger with run_e2e=true
  e2e-tests:
    runs-on: windows-latest
    if: github.event_name == 'workflow_dispatch' && inputs.run_e2e
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: "npm"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            src-tauri
            crates/wsl-core
          cache-on-failure: true

      - name: Cache tauri-driver
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/tauri-driver.exe
          key: ${{ runner.os }}-tauri-driver-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-tauri-driver-

      - name: Install tauri-driver
        run: |
          if (!(Get-Command tauri-driver -ErrorAction SilentlyContinue)) {
            cargo install tauri-driver
          }
        shell: pwsh

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Build frontend
        run: npm run build

      - name: Build Tauri app (debug)
        run: npm run tauri build -- --debug --no-bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      - name: Prepare non-elevated desktop testing
        shell: pwsh
        run: |
          choco install gsudo --version=2.6.1 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $gsudoDirectory = 'C:\tools\gsudo\Current'
          if (-not (Test-Path "$gsudoDirectory\gsudo.exe")) { throw 'gsudo installation not found' }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $gsudoDirectory
          $runnerSid = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          icacls "$env:GITHUB_WORKSPACE" /grant "*${runnerSid}:(OI)(CI)M"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check desktop test startup
        timeout-minutes: 5
        shell: pwsh
        run: gsudo --integrity Medium npm.cmd run test:e2e -- --spec src/test/e2e/specs/distro-name-spaces.spec.ts
        env:
          CI: true
          WSL_MOCK: "1"
          VERBOSE: "1"

      - name: Run E2E tests
        # wdio.conf.ts owns driver startup, runtime matching, and cleanup.
        # WebView2 150+ ignores WebDriver's debugging arguments in elevated processes.
        # Run at medium integrity, as Tauri's upstream CI does: tauri-apps/wry#1782.
        run: gsudo --integrity Medium npm.cmd run test:e2e -- --shard ${{ matrix.shard }}/4
        shell: pwsh
        env:
          CI: true
          WSL_MOCK: "1"
          VERBOSE: "1"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-test-results-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  # Summary job for branch protection - only checks required tests
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [unit-tests, rust-tests]
    if: always()
    steps:
      - name: Check required jobs passed
        run: |
          if [[ "${{ needs.unit-tests.result }}" != "success" ]] || \
             [[ "${{ needs.rust-tests.result }}" != "success" ]]; then
            echo "Required tests failed"
            exit 1
          fi
          echo "All required tests passed!"
