# Manual release workflow - use this only for emergency releases or re-building a tag
# For normal releases, use conventional commits and release-please will handle it automatically
name: Manual Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g., v1.0.0)"
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
          - target: aarch64-pc-windows-msvc
            arch: arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}

      - name: Check MSIX signing configuration
        shell: pwsh
        env:
          MSIX_SIGNING_CERTIFICATE: ${{ secrets.MSIX_SIGNING_CERTIFICATE }}
          MSIX_SIGNING_PASSWORD: ${{ secrets.MSIX_SIGNING_PASSWORD }}
        run: |
          if (-not $env:MSIX_SIGNING_CERTIFICATE -or -not $env:MSIX_SIGNING_PASSWORD) {
            throw 'Configure MSIX signing secrets before releasing. See docs/MSIX-SIGNING.md.'
          }

      - name: Resolve Node.js version for release tag
        id: node-version
        shell: pwsh
        run: |
          # Historical tags predate .node-version and were built with Node 24.
          $nodeVersion = if (Test-Path -LiteralPath .node-version) {
            (Get-Content -LiteralPath .node-version -Raw).Trim()
          } else {
            "24"
          }
          "version=$nodeVersion" >> $env:GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node-version.outputs.version }}
          cache: "npm"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            src-tauri
            crates/wsl-core
          cache-on-failure: true
          key: ${{ matrix.target }}

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_APTABASE_KEY: ${{ secrets.VITE_APTABASE_KEY }}
        with:
          tagName: ${{ inputs.tag }}
          releaseName: "WSL UI ${{ inputs.tag }}"
          releaseBody: |
            See the [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.

            ## Installation

            **Standard Installation:** Download the `.msi` installer below and run it.

            **Microsoft Store:** Also available on the [Microsoft Store](https://apps.microsoft.com/detail/9P8548KNJ2M9).

            **MSIX sideloading:** Download the `.msix`, matching `.cer`, and `Install-WSL-UI_<arch>.ps1`. Follow the [MSIX installation instructions](https://github.com/${{ github.repository }}/blob/main/docs/MSIX-SIGNING.md). Files ending `_store.msix` are unsigned Store submission packages.
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}

      - name: Convert version to MSIX format
        id: msix-version
        shell: pwsh
        run: |
          # Convert semver tag (v1.2.3) to MSIX 4-part version (1.2.3.0)
          $tag = "${{ inputs.tag }}"
          $version = $tag -replace '^v', ''
          $parts = $version.Split('.')
          # Ensure we have exactly 4 parts (MSIX requirement)
          while ($parts.Count -lt 4) {
            $parts += "0"
          }
          $msixVersion = ($parts[0..3]) -join '.'
          Write-Host "MSIX Version: $msixVersion"
          "msix_version=$msixVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build MSIX package
        shell: pwsh
        run: |
          .\scripts\build-msix.ps1 -Version "${{ steps.msix-version.outputs.msix_version }}" -Architecture "${{ matrix.arch }}"

      - name: Sign MSIX and export public certificate
        shell: pwsh
        env:
          MSIX_SIGNING_CERTIFICATE: ${{ secrets.MSIX_SIGNING_CERTIFICATE }}
          MSIX_SIGNING_PASSWORD: ${{ secrets.MSIX_SIGNING_PASSWORD }}
        run: |
          .\scripts\sign-msix.ps1 -PackagePath "dist/WSL.UI_${{ steps.msix-version.outputs.msix_version }}_${{ matrix.arch }}.msix"
          Copy-Item scripts/Install-WSL-UI.ps1 "dist/Install-WSL-UI_${{ matrix.arch }}.ps1"

      - name: Prepare portable exe
        shell: pwsh
        run: |
          $version = "${{ steps.msix-version.outputs.msix_version }}".Split('.')[0..2] -join '.'
          $src = "src-tauri/target/${{ matrix.target }}/release/wsl-ui.exe"
          $dst = "dist/WSL.UI_${version}_${{ matrix.arch }}_portable.exe"
          Copy-Item $src $dst
          Write-Host "Created portable exe: $dst"

      - name: Upload MSIX and portable exe to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ inputs.tag }}
          files: |
            dist/*.msix
            dist/*.cer
            dist/Install-WSL-UI_*.ps1
            dist/*_portable.exe
